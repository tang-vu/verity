name: Deploy dashboard

# Keeps the public dashboard in step with the repo.
#
# The Vercel project is linked by CLI only (web/.vercel/, gitignored) with no Git
# integration, so before this workflow existed a push shipped nothing and prod
# quietly drifted behind main — it was found 14h stale. This closes that gap.
#
# Setup — repo Settings > Secrets and variables > Actions:
#   VERCEL_TOKEN       create at https://vercel.com/account/tokens
#   VERCEL_ORG_ID      from web/.vercel/project.json ("orgId")
#   VERCEL_PROJECT_ID  from web/.vercel/project.json ("projectId")
# Without VERCEL_TOKEN the job skips instead of failing, so a fork with no
# secrets stays green — same convention as oracle-cycle.yml.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  # The cycle commits a refreshed snapshot using GITHUB_TOKEN, and pushes made
  # with that token deliberately do not trigger other workflows. Without this
  # trigger the dashboard's offline fallback would go stale between human pushes.
  workflow_run:
    workflows: ["Oracle cycle"]
    types: [completed]
  workflow_dispatch:

# Never let two deploys race to promote different builds to the same alias.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and promote to production
    runs-on: ubuntu-latest
    # A failed cycle leaves main untouched, so deploying after one only burns a
    # build. Checking the conclusion alone would also block push and dispatch,
    # where it is null — hence the event guard in front.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run checks out the default branch by default, which is what
          # we want here — deploy whatever main currently holds, snapshot included.
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Check the Vercel token is configured
        id: guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "No VERCEL_TOKEN secret — skipping the deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.guard.outputs.configured == 'true'
        run: npm ci

      - name: Pull the production environment
        if: steps.guard.outputs.configured == 'true'
        working-directory: web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        # Building here rather than on Vercel means a broken build fails this job
        # and production keeps serving the last good deployment.
        if: steps.guard.outputs.configured == 'true'
        working-directory: web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        if: steps.guard.outputs.configured == 'true'
        working-directory: web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
