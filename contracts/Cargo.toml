[package]
name = "verity-signal-oracle"
version = "0.1.0"
edition = "2021"
description = "Reputation-staked signal oracle smart contract for Casper (Odra)"
license = "MIT"
repository = "https://github.com/verity/verity"

[dependencies]
odra = { version = "2.8.1", default-features = false }

[build-dependencies]
odra-build = { version = "2.8.1" }

# Host-only deps (not compiled into the wasm contract).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
odra-build = { version = "2.8.1" }
odra-casper-livenet-env = { version = "2.8.1", optional = true }

[dev-dependencies]
odra-test = { version = "2.8.1" }

[features]
default = []
livenet = ["odra-casper-livenet-env"]

[lib]
name = "verity_signal_oracle"
crate-type = ["rlib"]

# cargo-odra builds this bin (per Odra.toml) to emit SignalOracle.wasm.
[[bin]]
name = "verity_signal_oracle_build_contract"
path = "bin/build_contract.rs"
test = false

[[bin]]
name = "verity_signal_oracle_build_schema"
path = "bin/build_schema.rs"
test = false

# Livenet deployment driver (cargo run --bin deploy_signal_oracle --features livenet).
[[bin]]
name = "deploy_signal_oracle"
path = "bin/deploy_signal_oracle.rs"
required-features = ["livenet"]
test = false

[profile.release]
codegen-units = 1
lto = true

[profile.dev.package."*"]
opt-level = 3
